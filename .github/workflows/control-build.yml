name: Build Xiaoxing Control APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 8 and 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17

      - name: Install Android SDK 28
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"; exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-28" "build-tools;28.0.3"
          echo "sdk.dir=$SDK_DIR" > control/local.properties

      # 签名必须固定：debug keystore 每次 runner 都新生成会导致签名不一致，
      # 新版装不上已装的旧版（INSTALL_FAILED_UPDATE_INCOMPATIBLE）。
      - name: Prepare stable debug keystore
        run: |
          mkdir -p ~/.android
          if [ -f control/debug.keystore ]; then
            cp control/debug.keystore ~/.android/debug.keystore
            echo "复用仓库里的 debug keystore"
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore               -storepass android -keypass android -alias androiddebugkey               -keyalg RSA -keysize 2048 -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.android/debug.keystore control/debug.keystore
            echo "首次生成 debug keystore（请把 artifact 里的文件提交回仓库）"
          fi
          keytool -list -keystore ~/.android/debug.keystore -storepass android | tail -3

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: control/debug.keystore

      - name: Download Gradle 5.4.1
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-5.4.1-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-5.4.1/bin" >> "$GITHUB_PATH"

      - name: Build APK
        working-directory: control
        run: |
          export JAVA_HOME="$JAVA_HOME_8_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoxing-control-apk
          path: control/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
