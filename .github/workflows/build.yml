name: Build Xiaoxing APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 装两个 JDK：17 用于运行 sdkmanager，8 用于构建老版 AGP 3.4.3
      - name: Setup JDK 8 and 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17

      # 不用第三方 setup-android action（易失败），直接用 runner 预装的 SDK 补装 platform 28
      - name: Install Android SDK 28
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          echo "SDK_DIR=$SDK_DIR"
          echo "SDKMANAGER=$SDKMANAGER"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"; exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-28" "build-tools;28.0.3"
          echo "sdk.dir=$SDK_DIR" > xiaoxing/local.properties
          cat xiaoxing/local.properties

      - name: Download Gradle 5.4.1
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-5.4.1-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-5.4.1/bin" >> "$GITHUB_PATH"

      - name: Build APK
        working-directory: xiaoxing
        run: |
          export JAVA_HOME="$JAVA_HOME_8_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoxing-apk
          path: xiaoxing/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
